<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameGrip Sports Demo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:none}
  canvas{display:block}
  #hud{position:fixed;left:18px;top:14px;color:#fff;font:600 13px/1.65 "Segoe UI",system-ui,sans-serif;
       text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.35);pointer-events:none;letter-spacing:.02em;user-select:none}
  #hud .t{font-size:10px;letter-spacing:.24em;opacity:.8}
  #hud .k{display:inline-block;min-width:11px;padding:0 4px;border:1.5px solid rgba(255,255,255,.9);border-radius:4px;
          text-align:center;margin-right:6px;font-size:10px;line-height:14px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  #hud .gap{display:inline-block;width:14px}
  #hud .bar{display:inline-block;width:96px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;vertical-align:middle;
            margin:0 10px 0 6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  #hud .bar i{display:block;height:100%;background:#fff;transition:width .25s}
  #hud .dim{opacity:.55}
  #hud .prompt{margin-top:6px;font-size:14px;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  #callout{position:fixed;left:0;right:0;top:30%;text-align:center;color:#fff;pointer-events:none;opacity:0;
           font:italic 900 86px/1 "Arial Black","Segoe UI Black",Impact,sans-serif;letter-spacing:.02em;
           -webkit-text-stroke:3px #12245a;text-shadow:0 6px 0 #12245a,0 10px 24px rgba(0,0,0,.45)}
  #callout.small{font-size:54px;top:22%}
  #callout.go{animation:pop 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
  #fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .16s}
</style>
</head>
<body>
<div id="hud"></div>
<div id="callout"></div>
<div id="fade"></div>

<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/": "../vendor/addons/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = {
  RUNS_TO_WIN: 3,      // batter wins at this many runs
  OUTS_TO_WIN: 3,      // pitcher wins at this many outs
  BOX_HP: 100,
  RESTART_WINDOW: 0.8, // seconds: both players must swing within this to restart
};
// GameGrip straps (ESP32 + MPU6050 running dtw_detector.py through gamegrip_server.py).
// Each strap is a device id; each game says which player that strap controls.
// Today there is one strap (esp1). For two straps, gamegrip_server.py just has to
// send swings with device "esp2" - this table already routes them.
const GRIP = {
  devices: {
    esp1: { baseball: 2, boxing: 1 },   // left port: batter, red (screen left)
    esp2: { baseball: 1, boxing: 2 },   // right port: pitcher, blue (screen right)
  },
  intensity: 0.7,   // dtw_detector reports no swing strength, so strap swings use this
  // The strap fires partway through the real swing, so the bat meets the ball
  // this many seconds after detection (keyboard presses use 0.1).
  swingLead: 0.08,
};
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const realNow = () => performance.now() / 1000;
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      const u = smooth((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], u)) : lerp(v0, v1, u);
    }
  }
  return keys[keys.length - 1][1];
}

/* =====================================================================
   RENDERER
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0, envMapIntensity: 0.55, ...o });
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}
const glowTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const starTex = canvasTex(128, 128, (g) => {
  g.translate(64, 64);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 62);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,244,170,.95)'); gr.addColorStop(1, 'rgba(255,200,60,0)');
  g.fillStyle = gr; g.beginPath();
  for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2, r = i % 2 ? 20 : 62; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  g.closePath(); g.fill();
});

/* =====================================================================
   AUDIO (synthesised, no files)
   ===================================================================== */
let AC = null, master = null, noiseBuf = null;
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // crowd murmur bed
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 0.5;
  const g = AC.createGain(); g.gain.value = 0.035;
  s.connect(f).connect(g).connect(master); s.start();
}
function noise(dur, { type = 'bandpass', freq = 1000, freqEnd, q = 1, gain = 0.5, attack = 0.003, at = 0 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + attack + dur + 0.05);
}
function tone(freq, dur, { type = 'sine', gain = 0.4, freqEnd, attack = 0.003, at = 0 } = {}) {
  if (!AC) return;
  const t = AC.currentTime + at;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + attack + dur + 0.05);
}
const sfx = {
  crack(q = 1) { noise(0.06, { type: 'highpass', freq: 2200, gain: 1.0 }); tone(1500, 0.05, { type: 'triangle', gain: 0.35, freqEnd: 600 }); noise(0.3, { freq: 650, q: 2, gain: 0.25 * q }); },
  mitt() { noise(0.07, { type: 'lowpass', freq: 900, gain: 0.9 }); tone(190, 0.08, { gain: 0.45, freqEnd: 70 }); },
  thump() { tone(160, 0.2, { gain: 1.0, freqEnd: 45 }); noise(0.09, { type: 'lowpass', freq: 1400, gain: 0.7 }); },
  whoosh() { noise(0.18, { freq: 450, freqEnd: 2600, q: 1.4, gain: 0.3, attack: 0.04 }); },
  bell(n = 1) { for (let i = 0; i < n; i++) { tone(1046, 1.1, { gain: 0.3, at: i * 0.3 }); tone(2490, 0.6, { gain: 0.08, at: i * 0.3 }); } },
  cheer(str = 1, dur = 2.5) { noise(dur, { freq: 1100, q: 0.6, gain: 0.32 * str, attack: 0.25 }); noise(dur * 0.8, { freq: 2700, q: 1, gain: 0.12 * str, attack: 0.3 }); },
  aww() { noise(1.0, { freq: 500, freqEnd: 260, q: 2, gain: 0.25, attack: 0.15 }); },
};

/* =====================================================================
   SHARED: AVATARS, IK, CROWD, FX
   ===================================================================== */
const SKINS = ['#fbe1c8', '#f3cfae', '#e8b88e', '#d29a6c', '#a86f47', '#7a4c2e'];
const HAIRS = ['#2a1a10', '#4b2c18', '#141414', '#7a4a22', '#d9a64e', '#a3392a', '#8a8a8a'];
const PANTS = ['#3b3f4a', '#2c3e66', '#4a4a52', '#2f4f3f', '#5a4636', '#22252c'];
const CROWD_PAL = ['#ef4a3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#ecf0f1', '#e67e22', '#1abc9c', '#ff6fa8', '#2f7fe0', '#6ad04a'];
const HAIR_STYLES = ['short', 'spiky', 'bob', 'long', 'swoop', 'short', 'spiky'];
const L1 = 0.32, L2 = 0.34; // upper arm / forearm

// ---- painted faces (drawn on the head's UV map; the +z face centre sits at u=0.25, v=0.5).
// Flat, friendly cartoon features: big simple eyes, soft thick brows, a small nose line and a
// plain mouth. 1 px here is about 2 mm on a head, so features are drawn large on purpose.
function drawFace(g, f) {
  const cx = 256, ey = 252, ex = f.eyeGap || 58;
  g.fillStyle = f.skin; g.fillRect(0, 0, 1024, 512);
  if (f.blush) { g.fillStyle = 'rgba(255,120,120,.16)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * 80, 312, 24, 13, 0, 0, 7); g.fill(); } }
  // brows: soft rounded bars; browTilt > 0 lowers the inner ends (determined), < 0 raises them (worried)
  g.strokeStyle = f.brow; g.lineCap = 'round'; g.lineWidth = (f.browThick || 9) * 1.25;
  for (const s of [-1, 1]) {
    const inner = cx + s * (ex - 26), outer = cx + s * (ex + 26), by = ey - (f.eye === 'sclera' ? 40 : 44);
    g.beginPath(); g.moveTo(inner, by + f.browTilt * 13); g.quadraticCurveTo(cx + s * ex, by - 6, outer, by - f.browTilt * 7); g.stroke();
  }
  // eyes
  for (const s of [-1, 1]) {
    const x = cx + s * ex;
    if (f.eye === 'sclera') {
      g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(x, ey, 24, 18, 0, 0, 7); g.fill();
      g.save(); g.clip();
      g.fillStyle = '#2b1a12'; g.beginPath(); g.arc(x + (f.look || 0) * 7, ey + 1, 14, 0, 7); g.fill();
      g.fillStyle = '#0c0c0c'; g.beginPath(); g.arc(x + (f.look || 0) * 7, ey + 1, 7, 0, 7); g.fill();
      g.restore();
      g.strokeStyle = '#1b1b1b'; g.lineWidth = 3.5; g.beginPath(); g.ellipse(x, ey, 24, 18, 0, 0, 7); g.stroke();
      g.lineWidth = 6; g.beginPath(); g.ellipse(x, ey, 24, 18, 0, Math.PI * 1.08, Math.PI * 1.92); g.stroke();   // heavier upper lid
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x + (f.look || 0) * 7 + 5, ey - 4, 3.6, 0, 7); g.fill();
    } else {
      g.fillStyle = '#161616'; g.beginPath(); g.ellipse(x, ey, 12, 19, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 4, ey - 7, 4, 0, 7); g.fill();
    }
  }
  if (f.glasses) {
    g.strokeStyle = '#2b2b2b'; g.lineWidth = 5;
    for (const s of [-1, 1]) { g.beginPath(); g.roundRect(cx + s * ex - 33, ey - 26, 66, 50, 16); g.stroke(); }
    g.beginPath(); g.moveTo(cx - ex + 33, ey - 4); g.lineTo(cx + ex - 33, ey - 4); g.stroke();
  }
  // nose
  const nc = shadeHex(f.skin, 0.72);
  g.strokeStyle = nc; g.lineWidth = 5.5; g.lineCap = 'round';
  if (f.nose === 2) { g.fillStyle = shadeHex(f.skin, 0.9); g.beginPath(); g.ellipse(cx, 296, 17, 13, 0, 0, 7); g.fill(); g.beginPath(); g.arc(cx, 296, 17, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
  else if (f.nose === 1) { g.beginPath(); g.moveTo(cx + 3, 268); g.quadraticCurveTo(cx - 16, 296, cx - 2, 306); g.quadraticCurveTo(cx + 7, 308, cx + 11, 301); g.stroke(); }
  else { g.beginPath(); g.arc(cx, 292, 13, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); }
  // facial hair
  if (f.beard) { g.fillStyle = f.brow; g.beginPath(); g.ellipse(cx, 346, 70, 48, 0, 0.05 * Math.PI, 0.95 * Math.PI); g.fill(); }
  if (f.mustache) { g.fillStyle = f.brow; g.beginPath(); g.ellipse(cx, 316, 30, 8, 0, 0, 7); g.fill(); }
  // mouth
  const my = 336, mw = (f.mouthW || 22) * 1.2;
  g.strokeStyle = '#3a1c14'; g.lineWidth = 6.5; g.lineCap = 'round';
  if (f.mouth === 'flat') { g.beginPath(); g.moveTo(cx - mw, my); g.lineTo(cx + mw, my); g.stroke(); }
  else if (f.mouth === 'smile') { g.beginPath(); g.moveTo(cx - mw, my - 4); g.quadraticCurveTo(cx, my + 14, cx + mw, my - 4); g.stroke(); }
  else {   // big open smile with a row of top teeth
    const w = mw + 8;
    g.fillStyle = '#4a1712'; g.beginPath(); g.moveTo(cx - w, my - 8); g.quadraticCurveTo(cx, my - 2, cx + w, my - 8); g.quadraticCurveTo(cx, my + 34, cx - w, my - 8); g.fill();
    g.save(); g.clip(); g.fillStyle = '#fff'; g.fillRect(cx - w, my - 12, w * 2, 13); g.fillStyle = '#e66a6a'; g.beginPath(); g.ellipse(cx, my + 22, 16, 9, 0, 0, 7); g.fill(); g.restore();
  }
}
function shadeHex(hex, k) { const c = new THREE.Color(hex); c.multiplyScalar(k); return '#' + c.getHexString(); }
function randomFace(skin, hair, crowd = false) {
  return {
    skin, brow: crowd ? '#2a1d16' : shadeHex(hair, 0.9), browTilt: rand(-0.15, 0.25), browThick: rand(8, 10),
    eye: crowd ? 'dot' : pick(['dot', 'dot', 'sclera']), look: rand(-0.6, 0.6), nose: (Math.random() * 3) | 0,
    mouth: pick(['smile', 'smile', 'smile', 'flat', 'grin']), mouthW: rand(18, 26), blush: Math.random() < 0.15,
    glasses: Math.random() < (crowd ? 0.15 : 0.12), beard: !crowd && Math.random() < 0.08, mustache: !crowd && Math.random() < 0.06,
  };
}
// The two boxers always look the same (from the user's reference characters).
const BOXER_LOOKS = {
  // tan skin, short black hair, big open smile
  red: { skin: '#e3a679', hair: '#1a1410', hairStyle: 'flat',
    face: { skin: '#e3a679', brow: '#1a1410', browTilt: 0.35, browThick: 11, eye: 'sclera', look: 0.2, nose: 2, mouth: 'grin', mouthW: 26 } },
  // light peach skin, dark-brown hair with pointed bangs, determined look, straight mouth
  blue: { skin: '#fbe0c4', hair: '#5a3826', hairStyle: 'bangs',
    face: { skin: '#fbe0c4', brow: '#2a1a12', browTilt: 0.6, browThick: 10, eye: 'sclera', look: -0.7, nose: 1, mouth: 'flat', mouthW: 20 } },
};
const faceTex = (f) => canvasTex(1024, 512, (g) => drawFace(g, f));

// ---- tiny geometry merger (indexed or not)
function mergeGeos(parts) {
  const pos = [], nor = [], uv = [], idx = []; let off = 0;
  for (const { geo, m } of parts) {
    const g = geo.clone(); if (m) g.applyMatrix4(m);
    const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    for (let i = 0; i < p.count; i++) { pos.push(p.getX(i), p.getY(i), p.getZ(i)); nor.push(n.getX(i), n.getY(i), n.getZ(i)); uv.push(u ? u.getX(i) : 0, u ? u.getY(i) : 0); }
    if (g.index) for (let i = 0; i < g.index.count; i++) idx.push(g.index.getX(i) + off);
    else for (let i = 0; i < p.count; i++) idx.push(i + off);
    off += p.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  out.setIndex(idx); return out;
}
const M4 = (x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) =>
  new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(sx, sy, sz));

// ---- hair (geometry in head space; head radius 0.28, y-scale 1.08)
function hairGeo(style, seg = 1) {
  const S = (r, t0, tl, p0 = 0, pl = Math.PI * 2) => new THREE.SphereGeometry(r, Math.max(8, 28 * seg | 0), Math.max(5, 14 * seg | 0), p0, pl, t0, tl);
  const front = Math.PI / 2; // phi of +z
  const parts = [];
  const cap = (tl, tilt, r = 0.296) => parts.push({ geo: S(r, 0, Math.PI * tl), m: M4(0, 0.01, 0, tilt, 0, 0, 1, 1.08, 1) });
  const sides = (tl, gap, r = 0.305) => parts.push({ geo: S(r, 0, Math.PI * tl, front + gap, Math.PI * 2 - gap * 2), m: M4(0, 0.01, 0, 0, 0, 0, 1, 1.08, 1) });
  if (style === 'short') {
    cap(0.5, -0.62); sides(0.5, 1.15);
  } else if (style === 'spiky') {
    cap(0.5, -0.66); sides(0.48, 1.1);
    const cone = new THREE.ConeGeometry(0.065, 0.17, 6);
    for (let i = 0; i < 9; i++) {
      const a = (i / 8 - 0.5) * 2.0, e = 0.55 + (i % 2) * 0.15;
      const dir = new V3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
      const q = new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), dir.clone().add(new V3(0, -0.35, 0.25)).normalize());
      const at = dir.clone().multiplyScalar(0.28); at.y = at.y * 1.08 + 0.02;
      parts.push({ geo: cone, m: new THREE.Matrix4().compose(at, q, new V3(1, 1, 1)) });
    }
  } else if (style === 'bangs') {   // full crown with pointed bangs hanging over the forehead
    cap(0.5, -0.62, 0.3); sides(0.56, 1.05, 0.308);
    const cone = new THREE.ConeGeometry(0.068, 0.2, 8);
    for (let i = 0; i < 7; i++) {
      const a = (i / 6 - 0.5) * 1.55, e = 0.62 - Math.abs(i / 6 - 0.5) * 0.25;
      const at = new V3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)).multiplyScalar(0.29); at.y *= 1.08;
      const q = new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), new V3(Math.sin(a) * 0.25, -1, 0.32).normalize());
      parts.push({ geo: cone, m: new THREE.Matrix4().compose(at, q, new V3(1, 1, 0.55)) });
    }
  } else if (style === 'flat') {    // short, squared-off crop
    parts.push({ geo: S(0.3, 0, Math.PI * 0.5), m: M4(0, 0.03, -0.01, -0.5, 0, 0, 1.0, 0.9, 1.0) }); sides(0.5, 1.2, 0.304);
  } else if (style === 'bob') {
    cap(0.5, -0.6, 0.302); sides(0.66, 0.95, 0.312);
  } else if (style === 'long') {
    cap(0.5, -0.6, 0.302); sides(0.82, 0.9, 0.315);
  } else { // side-swept
    parts.push({ geo: S(0.298, 0, Math.PI * 0.5), m: M4(0, 0.01, 0, -0.58, 0, 0.3, 1, 1.08, 1) }); sides(0.5, 1.15);
  }
  return mergeGeos(parts);
}

function headGeo(r = 0.28, w = 40, h = 28) {
  const g = new THREE.SphereGeometry(r, w, h), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), t = y / r;
    let sx, sy;

    let dmg = rand(11, 15) * (0.85 + 0.3 * f.punch.power) * (counter ? 1.5 : 1);
    o.hp = Math.max(0, o.hp - dmg);
    o.recoil = 0.5;
    const n = new THREE.Vector2().subVectors(o.p, f.p).normalize();
    o.kv.copy(n).multiplyScalar(counter ? 8.5 : 7);
    o.av.head.getWorldPosition(_h); fx.burst(_h, counter ? 1.4 : 1.0);
    o.av.flash = 0.12; sfx.thump(); shake = counter ? 0.35 : 0.22; excite = Math.min(1.5, excite + 0.45);
    if (counter) callout('COUNTER!', true);
    popBulbs(3);
    if (o.hp <= 0) {
      o.state = 'ko'; o.koT = 0; f.state = 'win'; slow = 1.0;
      sfx.bell(3); sfx.cheer(1.6, 4); excite = 1.6; popBulbs(10);
      callout('K.O.!');
      pendingOver = { t: 1.8, text: `${f.name} WINS!` };
    }
  }
  function popBulbs(n) {
    for (let i = 0; i < n; i++) {
      const b = pick(bulbs), a = Math.random() * Math.PI * 2, t = Math.random(), r = lerp(BR0, BR1, t);
      b.s.position.set(Math.cos(a) * r, BH * t + 1.2, Math.sin(a) * r); b.life = rand(0.08, 0.16) + Math.random() * 0.2;
    }
  }

  const GUARD_L = new V3(0.17, 0.86, 0.34), GUARD_R = new V3(-0.17, 0.82, 0.3);
  const PUNCH_L = new V3(0.05, 0.92, 1.0), PUNCH_R = new V3(-0.05, 0.92, 1.0);
  const POLE_GL = new V3(0.7, -1, -0.2).normalize(), POLE_GR = new V3(-0.7, -1, -0.2).normalize();

  function update(dtReal) {
    let dt = dtReal;
    if (slow > 0) { slow -= dtReal; dt = dtReal * 0.35; }
    T += dt; excite = Math.max(0, excite - dtReal * 0.3);
    if (pendingOver) { pendingOver.t -= dtReal; if (pendingOver.t <= 0) { callout(pendingOver.text); over = true; pendingOver = null; excite = 1.2; } }
    // circle each other, but keep the pair roughly side-on to the camera
    const ang = Math.atan2(F[1].p.y - F[0].p.y, F[1].p.x - F[0].p.x);
    const angGoal = 0.4 * Math.sin(T * 0.4);
    const circ = clamp(Math.atan2(Math.sin(ang - angGoal), Math.cos(ang - angGoal)) * 1.4, -0.8, 0.8);

    F.forEach((f, i) => {
      const o = F[1 - i], av = f.av;
      const dx = o.p.x - f.p.x, dz = o.p.y - f.p.y, dist = Math.hypot(dx, dz) || 1, nx = dx / dist, nz = dz / dist;
      f.cd -= dt; f.recoil = Math.max(0, f.recoil - dt); f.dodge = Math.max(0, f.dodge - dt);
      let vx = 0, vz = 0;
      if (f.state === 'fight' || f.state === 'win') {
        if (f.recoil < 0.2 && f.state === 'fight') {
          const radial = clamp((dist - 1.55) * 2.2, -1.2, 1.7);
          vx = nx * radial + (-nz) * circ; vz = nz * radial + nx * circ;
        }
        vx += f.kv.x; vz += f.kv.y;
        f.kv.multiplyScalar(Math.exp(-5 * dt));
        f.p.x += vx * dt; f.p.y += vz * dt;
        const r = f.p.length(); if (r > 3.0) f.p.multiplyScalar(3.0 / r);
      }
      // punch timeline
      let ext = 0;
      if (f.punch) {
        f.punch.t += dt;
        ext = kf(f.punch.t, [[0, 0], [0.08, 1], [0.13, 1], [0.28, 0]]);
        if (!f.punch.checked && f.punch.t >= 0.08) { f.punch.checked = true; tryHit(f, o); }
        if (f.punch && f.punch.t >= 0.28) f.punch = null;
      }
      // placement
      const lunge = ext * 0.14;
      av.root.position.set(f.p.x + nx * lunge, RING_Y, f.p.y + nz * lunge);
      if (f.state !== 'ko') av.root.rotation.y = Math.atan2(nx, nz);

      // pose
      const ph = av.ph, speed = Math.hypot(vx, vz);
      f.walkPh += dt * (4 + speed * 5);
      if (f.state === 'ko') {
        f.koT += dt;
        const u = Math.min(f.koT / 0.7, 1), bounce = u < 1 ? 0 : Math.max(0, Math.sin((f.koT - 0.7) * 12) * 0.06 * Math.exp(-(f.koT - 0.7) * 5));
        av.pose.rotation.x = -1.45 * (u * u) + bounce;
        av.body.position.y = 0.85;
        av.legs.L.rotation.set(-0.2 * u, 0, 0.15); av.legs.R.rotation.set(-0.35 * u, 0, -0.15);
        av.upper.rotation.set(0, 0, 0); av.head.rotation.set(-0.3 * u, 0.4 * u, 0);
        av.arms.L.sh.rotation.set(-2.4 * u, 0, 0.6 * u); av.arms.L.el.rotation.set(-0.2, 0, 0);
        av.arms.R.sh.rotation.set(-2.6 * u, 0, -0.5 * u); av.arms.R.el.rotation.set(-0.3, 0, 0);
      } else if (f.state === 'win') {
        const hop = Math.abs(Math.sin(T * 7)) * 0.12;
        av.body.position.y = 0.85 + hop;
        av.legs.L.rotation.set(0, 0, 0.12); av.legs.R.rotation.set(0, 0, -0.12);
        av.upper.rotation.set(-0.1, 0, 0); av.upper.position.set(0, 0, 0); av.head.rotation.set(-0.25, 0, 0);
        reach(av.arms.L, _t1.set(0.32, 1.5, 0.1), POLE_GL); reach(av.arms.R, _t1.set(-0.32, 1.5, 0.1), POLE_GR);
        av.root.rotation.y += dt * 2.0;
      } else {
        const rec = f.recoil / 0.5;
        const bob = Math.sin(T * 6.5 + ph) * 0.035;
        av.body.position.y = 0.78 + bob - (f.dodge > 0 ? 0.12 * Math.sin(f.dodge / 0.4 * Math.PI) : 0);
        const shuffle = Math.sin(f.walkPh) * Math.min(1, speed * 0.6 + 0.15);
        av.legs.L.rotation.set(shuffle * 0.5 - 0.15, 0, 0.16); av.legs.R.rotation.set(-shuffle * 0.5 + 0.2, 0, -0.16);
        const weave = 0.11 * Math.sin(T * 2.2 + ph) + (f.dodge > 0 ? f.dodgeDir * 0.5 * Math.sin(f.dodge / 0.4 * Math.PI) : 0);
        const twist = f.punch ? -f.punch.hand * 0.45 * ext : 0.12 * Math.sin(T * 1.7 + ph);
        av.upper.rotation.set(0.12 - rec * 0.45 + ext * 0.12, twist, weave);
        av.upper.position.set(weave * 0.25, 0, 0);
        av.head.rotation.set(-rec * 0.7 + 0.1, -twist * 0.5, 0);
        const gl = _t1.copy(GUARD_L), gr = _t2.copy(GUARD_R);
        gl.y += Math.sin(T * 6.5 + ph + 1) * 0.03; gr.y += Math.sin(T * 6.5 + ph + 2) * 0.03;
        if (f.punch) { if (f.punch.hand > 0) gl.lerp(PUNCH_L, ext); else gr.lerp(PUNCH_R, ext); }
        if (rec > 0) { gl.y -= rec * 0.25; gr.y -= rec * 0.25; gl.x += rec * 0.15; gr.x -= rec * 0.15; }
        reach(av.arms.L, gl, POLE_GL); reach(av.arms.R, gr, POLE_GR);
      }
      updateFlash(av, dtReal);
    });

    for (const b of bulbs) { b.life -= dtReal; b.s.material.opacity = b.life > 0 ? 1 : 0; }

    // camera
    const mx = (F[0].p.x + F[1].p.x) / 2, mz = (F[0].p.y + F[1].p.y) / 2;
    cam.position.lerp(_t1.set(mx * 0.4, 4.9, 6.9 + mz * 0.4), damp(2, dtReal));
    camLook.lerp(_t2.set(mx * 0.8, 1.75, mz * 0.8), damp(3, dtReal));
    cam.lookAt(camLook);

    crowd.update(T, excite);
    fx.update(dtReal);
  }

  function hud() {
    const bar = (f) => `<span class="bar"><i style="width:${Math.round(f.hp / CFG.BOX_HP * 100)}%"></i></span>`;
    return `<div class="t">BOXING</div>
      <div>${key('F')}red punch<span class="gap"></span>${key('J')}blue punch &middot; a fast swing punches</div>
      <div>${key('T')}switch to baseball</div>
      <div style="margin-top:4px">RED${bar(F[0])}BLUE${bar(F[1])}</div>`;
  }

  reset();
  cam.position.set(0, 4.9, 6.9); cam.lookAt(camLook);
  return { scene, cam, update, press, reset: () => { reset(); enter(); }, hud, get over() { return over; }, players: ['RED', 'BLUE'], verb: 'punch', enter };
}

/* =====================================================================
   GAME FLOW + INPUT
   ===================================================================== */
const games = { baseball: createBaseball(), boxing: createBoxing() };
let mode = 'baseball';
const lastPress = { 1: -99, 2: -99 };

function switchMode() {
  fadeEl.style.opacity = 1;
  setTimeout(() => {
    mode = mode === 'baseball' ? 'boxing' : 'baseball';
    calloutEl.className = ''; calloutEl.style.opacity = '';
    games[mode].enter();
    fadeEl.style.opacity = 0;
  }, 170);
}

/**
 * GameGrip input layer. Every input ends up in GameGrip.swing(player, intensity):
 *  - keyboard: G/F = player 1, V/J = player 2
 *  - straps:   SSE "swing" events from gamegrip_server.py -> GameGrip.deviceSwing(device)
 * intensity is 0..1 (normalised swing strength).
 */
const GameGrip = {
  swing(player, intensity = 0.6, lead) {
    ensureAudio();
    const g = games[mode], t = realNow();
    if (g.over) {
      lastPress[player] = t;
      if (t - lastPress[3 - player] < CFG.RESTART_WINDOW) { lastPress[1] = lastPress[2] = -99; g.reset(); }
      return;
    }
    g.press(player, clamp(intensity, 0, 1), lead);
  },
  deviceSwing(device, intensity = GRIP.intensity) {
    const map = GRIP.devices[device]; if (!map) return;
    GameGrip.swing(map[mode], intensity, GRIP.swingLead);
    strap.last = realNow();
  },
  // Left port (esp1) is the left player: red punch, batter, arm-pump run.
  // Right port (esp2) is the right player: blue punch, pitcher.
  // Boxing listens to light punches; baseball listens to calibrated swings.
  fromStrap(kind, device) {
    const who = device || 'esp1';
    if (strap.locked) return;
    strap.last = realNow();
    if (mode === 'boxing') {
      if (kind === 'punch') GameGrip.deviceSwing(who);
      return;
    }
    if (who === 'esp2' && kind === 'swing') GameGrip.swing(1, 0.7);
    else if (who === 'esp1' && kind === 'swing') GameGrip.swing(2, GRIP.intensity, GRIP.swingLead);
    else if (who === 'esp1' && kind === 'run' && games.baseball.run) games.baseball.run();
  },
  switchGame: switchMode,
};

/* ---- strap link: on by default when this page is served by gamegrip_server.py and
        calibration has finished; falls back to keyboard-only otherwise ---- */
// locked: strap motion is ignored until K, so the modules can be handled after calibration.
const strap = { server: false, live: false, sid: null, devices: new Set(), last: -9, locked: true };
(async function connectStraps() {
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) return;
    const st = await r.json();
    strap.server = true; strap.live = st.listening; strap.sid = st.sid ?? null; (st.devices || []).forEach(d => strap.devices.add(d));
  } catch { return; }
  const es = new EventSource('/api/events');
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (ev.sid !== strap.sid && (ev.type === 'connected' || ev.type === 'step')) {   // a new calibration started
      strap.sid = ev.sid; strap.live = false; strap.devices.clear();
    }
    if (ev.sid !== strap.sid && ev.type !== 'listening') return;
    if (ev.type === 'listening') {
      strap.sid = ev.sid; strap.live = true; strap.devices.add(ev.device || 'esp1');
      // The event names one board; /api/status lists every strap that is live.
      fetch('/api/status', { cache: 'no-store' }).then(r => r.json())
        .then(st => { if (st.sid === strap.sid) (st.devices || []).forEach(d => strap.devices.add(d)); })
        .catch(() => {});
    }
    else if (ev.type === 'error') { strap.live = false; strap.devices.clear(); }
    else if (strap.live && (ev.type === 'swing' || ev.type === 'punch' || ev.type === 'run'))
      GameGrip.fromStrap(ev.type, ev.device || 'esp1');
  };
})();
function strapHud() {
  if (!strap.server) return '';
  if (!strap.live) return `<div class="dim" style="margin-top:4px">GameGrip strap: waiting for calibration</div>`;
  if (strap.locked) return `<div style="margin-top:4px">${key('K')}GameGrip straps locked &middot; press K to unlock</div>`;
  const pulse = realNow() - strap.last < 0.25 ? ' style="color:#c8ff3d"' : '';
  // One strap: it plays the left player (batter / red) and the other player uses the keyboard.
  if (!strap.devices.has('esp2')) {
    const how = mode === 'boxing'
      ? `strap is red &middot; blue punches with ${key('J')}`
      : `strap bats &middot; pump it to run &middot; pitcher throws with ${key('G')}`;
    return `<div style="margin-top:4px"><span${pulse}>●</span> GameGrip ${how}</div>`;
  }
  const how = mode === 'boxing'
    ? 'left strap is red · right strap is blue'
    : 'left strap hits · right strap bowls · pump the left arm to run';
  return `<div style="margin-top:4px"><span${pulse}>●</span> GameGrip ${how}</div>`;
}
window.GameGrip = GameGrip;
window.__games = games; window.__makeAvatar = makeAvatar;

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'k') { ensureAudio(); strap.locked = !strap.locked; }
  else if (k === 't') { ensureAudio(); switchMode(); }
  else if (k === 'g' || k === 'f') GameGrip.swing(1, 0.6);
  else if (k === 'v' || k === 'j') GameGrip.swing(2, 0.6);
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  for (const g of Object.values(games)) { g.cam.aspect = innerWidth / innerHeight; g.cam.updateProjectionMatrix(); }
});

let hudCache = '';
function updateHud() {
  const g = games[mode];
  let h = g.hud() + strapHud();
  if (g.over) {
    const t = realNow(), ok = p => t - lastPress[p] < CFG.RESTART_WINDOW;
    h += `<div class="prompt">both players ${g.verb} to play again<span class="gap"></span>${g.players[0]} ${ok(1) ? '✓' : '·'}<span class="gap"></span>${g.players[1]} ${ok(2) ? '✓' : '·'}</div>`;
  }
  if (h !== hudCache) { hudEl.innerHTML = h; hudCache = h; }
}

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const g = games[mode];
  g.update(dt);
  // camera shake
  if (shake > 0) {
    shake = Math.max(0, shake - dt);
    const s = shake * 0.25;
    g.cam.position.x += (Math.random() - 0.5) * s; g.cam.position.y += (Math.random() - 0.5) * s;
  }
  updateHud();
  renderer.render(g.scene, g.cam);
}
frame();
</script>
