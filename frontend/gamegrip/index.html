<style>
  :root { --pulse: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #071200; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* screen FX */
  .halftone { position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(0,25,0,.55) 1.1px, transparent 1.7px); background-size: 7px 7px;
    mix-blend-mode: multiply; opacity: .5;
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 92%);
            mask-image: radial-gradient(ellipse at 50% 45%, transparent 38%, #000 92%); }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 calc(140px + var(--pulse) * 90px) rgba(2,22,0,.9); }
  .scan { position: fixed; inset: 0; pointer-events: none; opacity: .07;
    background: repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px); }
  #flash { position: fixed; inset: 0; background: #f4ffe0; opacity: 0; pointer-events: none; }

  /* comic shout text */
  #shouts { position: fixed; inset: 0; pointer-events: none; }
  .shout-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  .shout-inner { position: relative; display: flex; flex-direction: column; align-items: center; isolation: isolate; font-size: calc(var(--sz,1) * clamp(4.5rem, 17vw, 19rem)); }
  .shout { display: grid; font-family: 'Bangers', cursive; line-height: .82; letter-spacing: .02em; white-space: nowrap; text-align: center; padding: .08em .12em 0; }
  .shout > span { grid-area: 1 / 1; }
  .s-back { color: #0b2c00; -webkit-text-stroke: .1em #000; text-shadow: .06em .07em 0 #000, .1em .12em 0 #1f6b00, .13em .16em 0 #000; }
  .s-front { background: linear-gradient(180deg, #ffffff 0%, #ffffff 36%, #e6ff86 50%, #9be22c 70%, #3f9e00 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .018em #000; }
  .s-sub { font-family: 'Bangers', cursive; font-size: .22em; letter-spacing: .08em; color: #fff; -webkit-text-stroke: .09em #000; paint-order: stroke fill;
    background: #000; padding: .05em .5em .0em; transform: rotate(-3deg) translateY(.25em); border-radius: .2em; box-shadow: .08em .08em 0 #9be22c; z-index: 2; }
  .burst { position: absolute; left: -22%; top: -38%; width: 144%; height: 176%; max-width: none; z-index: -1; overflow: visible; }
  .rays { position: absolute; width: 230vmax; height: 230vmax; left: 50%; top: 50%; translate: -50% -50%; z-index: -2; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(200,255,61,.55) 0deg 7deg, rgba(255,255,255,0) 7deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 45%); mask-image: radial-gradient(circle, #000 0%, transparent 45%);
    animation: spin 8s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }

  /* frutiger glossy pills */
  .pill { position: relative; overflow: hidden; font-family: 'Bangers', cursive; letter-spacing: .05em; color: #fff;
    -webkit-text-stroke: 2.5px #000; paint-order: stroke fill; border: 4px solid #000; border-radius: 999px;
    padding: .28em 1.3em .18em 2.6em; text-shadow: 3px 3px 0 #000;
    box-shadow: 0 8px 0 #000, 0 0 0 5px rgba(255,255,255,.75), 0 22px 40px rgba(0,50,0,.55);
    transform: scale(calc(1 + var(--pulse) * .045)); transition: filter .15s; cursor: pointer; }
  .pill::before { content: ''; position: absolute; left: 5%; right: 5%; top: 5%; height: 46%; border-radius: 999px;
    background: linear-gradient(rgba(255,255,255,.95), rgba(255,255,255,.08)); pointer-events: none; }
  .pill::after { content: ''; position: absolute; inset: 0; border-radius: 999px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, rgba(255,255,255,.55), transparent 55%); }
  .pill.noico { padding: .28em 1.3em .18em; }
  .pill:hover { filter: brightness(1.12) saturate(1.2); }
  .pill:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #000, 0 0 0 5px rgba(255,255,255,.75); }
  .pill.mc { background: linear-gradient(180deg, #d4ff6e 0%, #7fd61c 45%, #3c9a00 70%, #2a6d00 100%); }
  .pill.rb { background: linear-gradient(180deg, #ffffff 0%, #d9e5dc 45%, #8a9a8f 75%, #4c5a51 100%); }
  .pill .ico { position: absolute; left: .55em; top: 50%; translate: 0 -50%; width: 1.25em; height: 1.25em; z-index: 1; }

  /* HUD */
  .chip { font-family: 'Bangers', cursive; letter-spacing: .06em; border: 3px solid #000; border-radius: 999px; padding: .2em .9em .05em;
    background: linear-gradient(#fff, #cfe8c9); color: #000; box-shadow: 0 4px 0 #000; position: relative; overflow: hidden; transition: all .3s; }
  .chip::before { content: ''; position: absolute; left: 6%; right: 6%; top: 4%; height: 45%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,0)); }
  .chip.active { background: linear-gradient(#f3ff9e, #c8ff3d 50%, #6fc400); transform: scale(calc(1.12 + var(--pulse) * .08)) rotate(-3deg); }
  .chip.done { background: linear-gradient(#b8ff5a, #3fa300); color: #fff; -webkit-text-stroke: 1.5px #000; paint-order: stroke fill; }
  .rec { font-family: 'Bangers', cursive; letter-spacing: .1em; }
  .recdot { width: .8em; height: .8em; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 12px #ff2a2a; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .hidden2 { opacity: 0; pointer-events: none; }
  /* error card (ESP32 / bridge problems) — same black tag + lime offset as "PICK YOUR GAME" */
  .errbox { font-family: 'Nunito', sans-serif; font-weight: 900; color: #fff; background: #000; border: 3px solid #000; border-radius: .6em;
    padding: .8em 1.1em; box-shadow: 6px 6px 0 #9be22c, 0 0 0 5px rgba(255,255,255,.75), 0 22px 40px rgba(0,50,0,.55); rotate: -1.5deg; line-height: 1.35; }
  .errbox .errhead { font-family: 'Bangers', cursive; font-weight: 400; letter-spacing: .1em; color: #c8ff3d; font-size: 1.35em; display: flex; align-items: center; gap: .45em; margin-bottom: .25em; }
  .errbox code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: #c8ff3d; }
  /* ---- frame: thin border + ring/dither corner pieces ---- */
  #frame { position: fixed; inset: 0; pointer-events: none; }
  #frame .edge { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame svg { position: absolute; width: clamp(170px, 34vmin, 360px); height: clamp(170px, 34vmin, 360px); overflow: visible; }
  #frame .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
  /* ---- DEMOS theme: teal -> pale yellow -> pink with black swirls (from the floral reference) ---- */
  html.theme-demos, html.theme-demos body { background: #0d2c2e; }
  .theme-demos .halftone { background-image: radial-gradient(rgba(10,30,40,.5) 1.1px, transparent 1.7px); }
  .theme-demos .vignette { box-shadow: inset 0 0 calc(140px + var(--pulse) * 90px) rgba(18,8,26,.85); }
  .theme-demos #flash { background: #fff3f9; }
  .theme-demos .s-back { color: #1b1030; text-shadow: .06em .07em 0 #000, .1em .12em 0 #e0559a, .13em .16em 0 #000; }
  .theme-demos .s-front { background: linear-gradient(180deg, #ffffff 0%, #ffffff 36%, #ffe3f0 50%, #f48cc0 70%, #1fa39d 100%); -webkit-background-clip: text; background-clip: text; }
  .theme-demos .s-sub { box-shadow: .08em .08em 0 #3fc1bb; }
  .theme-demos .rays { background: repeating-conic-gradient(from 0deg, rgba(255,166,207,.5) 0deg 7deg, rgba(255,255,255,0) 7deg 15deg); }
  .theme-demos .burst polygon[fill="#1f6b00"] { fill: #e0559a; }
  .theme-demos .pill.mc { background: linear-gradient(180deg, #b4f4ee 0%, #46c6bf 45%, #1d958f 70%, #126a66 100%); }
  .theme-demos .pill.rb { background: linear-gradient(180deg, #fff0f7 0%, #f7b3d2 45%, #e2609f 75%, #a8326d 100%); }
  .theme-demos .chip { background: linear-gradient(#fff, #f6d6e5); }
  .theme-demos .chip.active { background: linear-gradient(#fff0f7, #f48cc0 50%, #d94f93); }
  .theme-demos .chip.done { background: linear-gradient(#9ff2eb, #1d9f98); }
  .theme-demos .bg-lime-hot { background: #f48cc0; }
  .theme-demos .shadow-\[4px_4px_0_\#9be22c\] { box-shadow: 4px 4px 0 #3fc1bb !important; }
  .theme-demos .errbox { box-shadow: 6px 6px 0 #3fc1bb, 0 0 0 5px rgba(255,255,255,.75), 0 22px 40px rgba(20,0,30,.55); }
  .theme-demos .errbox .errhead, .theme-demos .errbox code { color: #f48cc0; }
  .theme-demos #frame [fill="#9be22c"] { fill: #3fc1bb; }
  .theme-demos #frame [fill="#c8ff3d"] { fill: #f48cc0; }
  .theme-demos #frame [fill="#2f7d00"] { fill: #e98bb8; }
  .theme-demos #frame [stroke="#9be22c"] { stroke: #f48cc0; }
</style>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const gsap = window.gsap;
const V3 = THREE.Vector3, TAU = Math.PI * 2;
try { await document.fonts.load('200px Bangers'); } catch (e) {}

/* ============================================================
   DEVICE HOOKS — the real strap firmware/driver listens to these
   window.addEventListener('gamegrip:record-start', e => e.detail)
   ============================================================ */
const emit = (type, detail = {}) => window.dispatchEvent(new CustomEvent('gamegrip:' + type, { detail }));
window.GameGrip = { game: null, BPM: 120 };

/* ---------------- seeded random ---------------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1337);
const rr = (a, b) => a + (b - a) * R();
const pick = (arr) => arr[Math.floor(R() * arr.length)];

/* ---------------- renderer ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.fog = new THREE.FogExp2(0x3f8a14, 0.0105);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// DEMOS theme: recolours the greens/limes of the finished frame with the reference's
// teal -> pale yellow -> pink gradient (left to right, a little diagonal), keeping each
// pixel's brightness so blacks, whites and shading are untouched. uMix 0 = original look.
const themePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uMix: { value: 0 },
    cL: { value: new THREE.Color(0x38b4c8) }, cM: { value: new THREE.Color(0xf4efc8) }, cR: { value: new THREE.Color(0xf49ac4) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uMix; uniform vec3 cL, cM, cR; varying vec2 vUv;
    float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main() {
      vec4 src = texture2D(tDiffuse, vUv); vec3 c = src.rgb;
      float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b)), sat = mx - mn;
      // hue in 0..1 (lime ~0.21, green ~0.27); weight covers yellow-green through green
      float h = 0.0;
      if (sat > 1e-4) {
        if (mx == c.r) h = mod((c.g - c.b) / sat, 6.0);
        else if (mx == c.g) h = (c.b - c.r) / sat + 2.0;
        else h = (c.r - c.g) / sat + 4.0;
        h /= 6.0;
      }
      float green = smoothstep(0.12, 0.17, h) * (1.0 - smoothstep(0.44, 0.5, h)) * smoothstep(0.03, 0.16, sat / max(mx, 1e-3));
      float x = clamp(vUv.x * 0.85 + (1.0 - vUv.y) * 0.15, 0.0, 1.0);
      vec3 grad = x < 0.5 ? mix(cL, cM, x * 2.0) : mix(cM, cR, (x - 0.5) * 2.0);
      vec3 tinted = clamp(grad * (lum(c) / max(lum(grad), 1e-3)), 0.0, 1.0);
      tinted = mix(tinted, grad, smoothstep(0.75, 1.0, lum(c)) * 0.6);   // bright limes become the clean gradient colour
      gl_FragColor = vec4(mix(c, tinted, green * uMix), src.a);
    }`,
});
themePass.enabled = false;
composer.addPass(themePass);

function applyDemosTheme() {
  document.documentElement.classList.add('theme-demos');
  themePass.enabled = true;
  gsap.to(themePass.uniforms.uMix, { value: 1, duration: 0.6, ease: 'power2.out' });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xeaffd0, 0x0b1f04, 1.25));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xb6ff4a, 2.0); scene.add(rim, rim.target);

/* ---------------- tick system ---------------- */
const ticks = [];
const onTick = (f) => ticks.push(f);
const drivers = [];

/* ---------------- materials ---------------- */
const M = {
  sil: new THREE.MeshBasicMaterial({ color: 0x030503 }),
  silGreen: new THREE.MeshBasicMaterial({ color: 0x0d3305 }),
  silLime: new THREE.MeshBasicMaterial({ color: 0x9be22c }),
  silWhite: new THREE.MeshBasicMaterial({ color: 0xf2ffe8 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1 }),
  silver: new THREE.MeshStandardMaterial({ color: 0xdfe8df, metalness: 0.85, roughness: 0.22 }),
  blackGloss: new THREE.MeshPhysicalMaterial({ color: 0x080908, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05 }),
  cone: new THREE.MeshPhysicalMaterial({ color: 0x0c0d0c, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x0f2a12, roughness: 0.05, metalness: 0.2, clearcoat: 1, transparent: true, opacity: 0.85 }),
  limeGlow: new THREE.MeshBasicMaterial({ color: new THREE.Color(0xc8ff3d).multiplyScalar(1.6), toneMapped: false }),
  whiteGlow: new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(1.4), toneMapped: false }),
};
const gloss = (c, extra = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.16, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, ...extra });
M.lime = gloss(0x8fdc1f); M.limeHot = gloss(0xc8ff3d); M.white = gloss(0xf4fff0); M.deep = gloss(0x2f7d00);

const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const shadowAll = (o, cast = true, recv = false) => o.traverse(c => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = recv; } });

/* ---------------- canvas textures ---------------- */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const circ = (ctx, x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); ctx.fill(); };

function drawSplat(ctx, cx, cy, Rr, color, rnd, drips = false) {
  ctx.fillStyle = color;
  for (let i = 0; i < 16; i++) { const a = rnd() * TAU, r = rnd() * Rr * 0.42; circ(ctx, cx + Math.cos(a) * r, cy + Math.sin(a) * r, Rr * (0.22 + rnd() * 0.3)); }
  const n = 16 + (rnd() * 16 | 0);

const groups = {};
function pop(tag, obj) {
  (groups[tag] ??= []).push(obj);
  obj.userData.base = { p: obj.position.clone(), s: obj.scale.clone() };
  obj.visible = false; scene.add(obj); return obj;
}
function reveal(tag, stagger = 0.03, delay0 = 0) {
  (groups[tag] || []).forEach((o, i) => {
    const b = o.userData.base, d = delay0 + i * stagger;
    o.visible = true; o.scale.setScalar(0.001); o.position.y = b.p.y - 5;
    gsap.to(o.scale, { x: b.s.x, y: b.s.y, z: b.s.z, duration: 1.1, delay: d, ease: 'elastic.out(1,0.5)' });
    gsap.to(o.position, { y: b.p.y, duration: 0.75, delay: d, ease: 'back.out(1.8)' });
  });
}

class RibbonArrow {
  constructor(curve, { width = 1, thick = 0.3, segs = 240, headLen = 1.6, headW = 2.2, flat = false, dark = false } = {}) {
    this.curve = curve; this.segs = segs; this.flat = flat; this.P = 16;
    if (!flat) this.frames = curve.computeFrenetFrames(segs, false);
    const P = this.P, pos = [], uv = [], idx = [], len = curve.getLength();
    for (let i = 0; i <= segs; i++) {
      const u = i / segs, p = curve.getPointAt(u), { S, N } = this.frame(u, i);
      const taper = Math.min(1, 0.35 + u * 7);
      for (let k = 0; k < P; k++) {
        const th = (k / P) * TAU, c = Math.cos(th), s = Math.sin(th);
        const x = (width / 2) * taper * Math.sign(c) * Math.pow(Math.abs(c), 0.5), y = (thick / 2) * Math.sign(s) * Math.pow(Math.abs(s), 0.5);
        pos.push(p.x + S.x * x + N.x * y, p.y + S.y * x + N.y * y, p.z + S.z * x + N.z * y);
        uv.push(u * len / 3, k / P);
      }
    }
    for (let i = 0; i < segs; i++) for (let k = 0; k < P; k++) {
      const a = i * P + k, b = i * P + (k + 1) % P, c = (i + 1) * P + k, d = (i + 1) * P + (k + 1) % P;
      idx.push(a, b, c, b, d, c);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    const tex = (dark ? darkStripeTex : stripeTex).clone(); tex.needsUpdate = true;
    this.mat = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.04, side: THREE.DoubleSide });
    this.body = new THREE.Mesh(geo, this.mat); this.body.castShadow = true; this.body.frustumCulled = false;
    const hs = new THREE.Shape(); hs.moveTo(-headW / 2, 0); hs.lineTo(0, headLen); hs.lineTo(headW / 2, 0); hs.lineTo(0, headLen * 0.18); hs.closePath();
    const hg = new THREE.ExtrudeGeometry(hs, { depth: thick * 0.8, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 4 });
    hg.translate(0, -0.15, -thick * 0.4);
    this.head = new THREE.Mesh(hg, dark ? M.blackGloss : M.limeHot); this.head.castShadow = true;
    this.group = new THREE.Group(); this.group.add(this.body, this.head);
    this.headPos = new V3(); this.setRange(0, 0.001);
  }
  frame(u, i) {
    if (this.flat) { const T = this.curve.getTangentAt(Math.min(u, 0.9999)); const S = new V3().crossVectors(T, new V3(0, 1, 0)).normalize(); return { T, S, N: new V3().crossVectors(S, T) }; }
    const j = i ?? Math.round(u * this.segs); const T = this.frames.tangents[j], S = this.frames.binormals[j]; return { T, S, N: new V3().crossVectors(S, T) };
  }
  setRange(a, b) {
    const s0 = Math.floor(a * this.segs), s1 = Math.max(s0, Math.floor(b * this.segs));
    this.body.geometry.setDrawRange(s0 * this.P * 6, (s1 - s0) * this.P * 6);
    const u = Math.min(1, Math.max(0, b)), { T, S, N } = this.frame(u);
    this.headPos.copy(this.curve.getPointAt(u));
    this.head.position.copy(this.headPos);
    this.head.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(S, T, N));
    this.head.visible = b - a > 0.002;
  }
}

function makeTruss(L, s = 0.5) {
  const geos = [], h = s / 2, cs = [[-h, -h], [-h, h], [h, h], [h, -h]];

}

function drawBuildingCut(ctx, W, H, rnd) {

  const m = 6, top = H * (0.04 + rnd() * 0.08);

  const style = Math.floor(rnd() * 4);
  if (style === 0) shapes.push([W * 0.2, top, W * 0.6, H]);                       // setback crown
  if (style === 1) { shapes.push([W * 0.3, top - H * 0.02, W * 0.4, H]); shapes.push([W * 0.47, 0, W * 0.06, H]); } // spire
  if (style === 2) { shapes[0][1] = top + H * 0.2; shapes.push([m, top, W * 0.45, H]); }                             // twin step
  ctx.fillStyle = body; shapes.forEach(([x, y, w, h]) => ctx.fillRect(x, y, w, h - y));

  ctx.fillStyle = lit; const wst = Math.floor(rnd() * 3);
  if (wst === 0) for (let y = shapes[0][1] + 14; y < H; y += 22) { ctx.fillRect(0, y, W, 8); ctx.fillStyle = body; for (let x = 0; x < W; x += 18) ctx.fillRect(x, y, 3, 8); ctx.fillStyle = lit; }

const SONG_START = 94, FIRST_BEAT = 94.522, BPM = 109.6, SPB = 60 / BPM;

function initAudio() {
  const ctx = actx; ctx.resume();

  const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);

    src.connect(master); A.t0 = ctx.currentTime + 0.05; A.dur = buf.duration; src.start(A.t0, SONG_START);
  });

  A.songTime = () => { const e = ctx.currentTime - A.t0; const L = A.dur - SONG_START; return SONG_START + (e < L ? e : (e - L) % L); };
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };

  const tone = (t, type, f, peak, d, cutoff = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; const g = ctx.createGain(); env(g, t, 0.005, peak, d); let n = o; if (cutoff) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cutoff; fl.Q.value = 5; o.connect(fl); n = fl; } n.connect(g).connect(fx); o.start(t); o.stop(t + d + 0.05); return o; };

  const kick = (t) => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13); const g = ctx.createGain(); env(g, t, 0.002, 1.0, 0.38); o.connect(g).connect(fx); o.start(t); o.stop(t + 0.45); };
  A.sfx = {
    blip: (f = 880) => { const t = ctx.currentTime; tone(t, 'square', f, 0.18, 0.12, 4000); tone(t, 'sine', f * 2, 0.12, 0.2); },
    whoosh: () => { const t = ctx.currentTime; const f = noise(t, 'bandpass', 400, 1.2, 0.5, 0.9); f.frequency.exponentialRampToValueAtTime(5000, t + 0.8); },
    boom: () => { const t = ctx.currentTime; kick(t); noise(t, 'lowpass', 1200, 0.5, 0.9, 1.1); [0, 4, 7, 12].forEach((n, i) => tone(t + i * 0.06, 'sawtooth', mtof(69 + n), 0.09, 0.4, 3000)); },

}

/* ---- BRIDGE to gamegrip_server.py, which runs dtw_detector.py and streams what it prints ---- */
const ABORT = Symbol('abort');
let failed = false;
const bridge = (() => {
  const B = { sid: null, starting: false, handlers: new Set(), pending: [] };
  const deliver = (ev) => B.handlers.forEach(f => f(ev));
  try {
    new EventSource('/api/events').onmessage = (m) => {
      let ev; try { ev = JSON.parse(m.data); } catch { return; }
      if (B.sid === null) { if (B.starting) B.pending.push(ev); return; }   // session id not back yet
      if (ev.sid === B.sid) deliver(ev);
    };
  } catch (e) {}
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  B.on = (f) => { B.handlers.add(f); return () => B.handlers.delete(f); };
  // resolves on the next event of `type`, rejects if the ESP32 errors first
  B.waitFor = (type) => new Promise((res, rej) => { const off = B.on(ev => { if (ev.type === type) { off(); res(ev); } else if (ev.type === 'error') { off(); rej(ABORT); } }); });
  B.start = async (game) => {
    B.starting = true;
    const r = await post('/api/start', { game });
    B.sid = r.sid; B.pending.splice(0).filter(ev => ev.sid === B.sid).forEach(deliver);
    return r;
  };
  B.ready = () => post('/api/ready', { sid: B.sid }).catch(() => {});   // = "Press [Enter]" in the terminal
  return B;
})();
const guard = async (p) => { const r = await p; if (failed) throw ABORT; return r; };

/* ---- calibration steps, driven line-by-line by dtw_detector's terminal output ---- */
const COUNT_MS = 1000;   // dtw_detector countdown(): one number per second
const swingViews = [
  null,
  { pos: [-2.5, 5.5, SZ + 21], look: [0, 4, SZ] },
  { pos: [3, 10, SZ + 39], look: [0, 4.5, SZ + 4] },
  { pos: [0, 3, 198], look: [-2, 1, 182] },
];
// What each calibration recording is called on screen. The detector still records
// "still" + 3 swings (internal steps 1-3); the player is shown HOLD STILL -> MOVE RIGHT -> MOVE DOWN.
// Internal swing 3 is a silent extra MOVE DOWN that shares the MOVE DOWN chip.
// chip = index into #steps, call = shown on the "3", count = sub-title on "2"/"1", go = shout when recording starts.
const STEP_UI = {
  still: { chip: 0 },
  1: { chip: 1, call: 'MOVE RIGHT!', count: 'MOVE RIGHT IN', go: 'RIGHT!' },
  2: { chip: 2, call: 'MOVE DOWN!', count: 'MOVE DOWN IN', go: 'DOWN!' },
  3: { chip: 2, call: 'MOVE DOWN!', count: 'MOVE DOWN IN', go: 'DOWN!' },
};
const LAST_STEP = 3;   // internal swing count
function toStage() {
  // hold-still is done: arrow curls + zooms off while the camera flies to the stage (inside swing 1's 3s countdown)
  curlArrow(new V3(-2.2, 3.6, 64));
  reveal('stage', 0.018);
  setTimeout(() => { if (!failed) moveCam([-0.8, 3.7, SZ + 9.5], [-0.8, 3.6, SZ], 1.7, 'power3.inOut'); }, 1200);
}
function calibrateFromPython() {
  return new Promise((resolve, reject) => {
    let step = 0, kind = 'still', retry = false, lastShout = Promise.resolve(), detail = null;
    const statusShout = (text, opts) => { lastShout = shout(text, opts); };
    const off = bridge.on(ev => {
      switch (ev.type) {
        case 'step':                       // "--- Step 1 ..." / "--- Step 2: Calibration swing #n of 3 ---"
          step = ev.step; kind = ev.kind; setStep(kind === 'still' ? 0 : STEP_UI[step].chip, 'active');
          if (kind === 'swing' && step === 1) toStage();
          emit('countdown-start', { step, kind, durationMs: 3 * COUNT_MS });
          break;
        case 'count': {                    // "  3..." "  2..." "  1..."  (printed exactly 1 s apart)
          if (failed) break;
          const n = ev.n, moving = kind === 'swing' && step === 1;   // swing 1's countdown runs during the fly-over to the stage
          cutShouts(); sfx('blip', 660 + (3 - n) * 110);
          const sub = kind === 'still' ? (retry && n === 3 ? 'MOVED! TRY AGAIN IN' : 'HOLD STILL IN') : n === 3 ? STEP_UI[step].call : STEP_UI[step].count;
          if (n === 1) retry = false;
          shout(String(n), { sub, hold: 0.38, size: moving ? 0.95 : 1.5, rays: !moving, top: moving, tilt: n % 2 ? -7 : 5 });
          break;
        }
        case 'record-start': {             // ">>> Hold still... <<<" / ">>> SWING #n NOW! <<<"
          const ms = ev.ms, still = kind === 'still'; cutShouts();
          detail = { step, kind, durationMs: ms, game: window.GameGrip.game };
          emit('record-start', detail); sfx('rec');
          recBox.classList.remove('hidden2'); gsap.fromTo(recBar, { width: '0%' }, { width: '100%', duration: ms / 1000, ease: 'none' });
          shout(still ? 'HOLD IT...' : STEP_UI[step].go, { hold: 1.0, size: 1.1, tilt: -9 });
          if (still) {
            cam.idle = 0;
          } else {
            sfx('whoosh'); if (step === 3) reveal('floor', 0.02); if (step === 2) reveal('sky', 0.04);
            gsap.to(cam, { sway: 1, duration: 0.2 }); gsap.to(cam, { sway: 0, duration: 0.4, delay: ms / 1000 - 0.3 });
            const v = swingViews[step]; moveCam(v.pos, v.look, ms / 1000, 'power2.out');
            spawnNotes(new V3(cam.look.x, 4, cam.look.z + 8), 14, 9);
            setTimeout(() => spawnNotes(new V3(cam.look.x, 4, cam.look.z + 6), 10, 9), 700);
          }
          break;
        }
        case 'record-end': {               // "Baseline captured ..." / "Recorded."
          emit('record-end', detail);
          recBox.classList.add('hidden2'); cam.idle = 1;
          sfx('ding'); flash(0.35);
          // Python prints the next step's "3..." straight after this, so only the last one gets its own banner.
          // A chip shared by several recordings (MOVE DOWN) only ticks when its last recording is done.
          if (kind === 'swing') {
            const s = step, chip = STEP_UI[s].chip, chipDone = s === LAST_STEP || STEP_UI[s + 1].chip !== chip;
            if (s === LAST_STEP) { statusShout('RECORDED!', { hold: 0.4, size: 1.0, burst: true, tilt: 4 }); lastShout.then(() => setStep(chip, 'done')); }
            else if (chipDone) setStep(chip, 'done');
          }
          break;
        }
        case 'still-ok':                   // "Still check OK."
          setStep(0, 'done');               // the swing-1 countdown starts on the same beat, so no separate banner
          break;
        case 'still-continue':             // "Continuing anyway; detection may be less reliable."
          setStep(0, 'done');
          break;
        case 'still-retry':                // "Sensor moved ..." + "Let's try that again ..."
          retry = true;                    // shown on the retry's "3" (Python starts it on the same beat)
          break;
        case 'calibrated':                 // "CALIBRATED!"
          off(); lastShout.then(resolve);
          break;
        case 'error':
          off(); reject(ABORT);
          break;
      }
    });
  });
}

async function introArrow() {
  const curve = new THREE.CatmullRomCurve3([[-3.5, -2.5, 0], [-3.4, 3, 1.5], [-0.5, 5.4, 5], [2, 0.9, 9], [1.2, 4.2, 13], [-0.5, 1.0, 16.5], [0.4, 5.2, 19.5], [0, 4.6, 22.2], [0, 3.6, 23]].map(p => new V3(...p)), false, 'centripetal');
  const A = new RibbonArrow(curve, { width: 1.0, thick: 0.38, segs: 320, headLen: 1.5, headW: 2.1, dark: true });
  scene.add(A.group);
  spawnConfetti(new V3(-3.5, 0.1, 0), 26, 7); scene.add(floorDecal(splatTex('#c8ff3d', 5), 6, -3.5, 0.3, 0.4));
  sfx('whoosh'); flash(0.25);
  const st = { p: 0 }, tmp = new V3(), tip = new V3(), box = new THREE.Box3();
  await new Promise(res => {
    const tween = gsap.to(st, {
      p: 1, duration: 3.1, ease: 'power1.in', onComplete: res, onUpdate: () => {
        A.setRange(0, st.p); const h = A.headPos;
        cam.pos.lerp(tmp.set(h.x * 0.3, 2.8 + h.y * 0.35, Math.max(11, h.z + 11.5)), 0.09);
        cam.look.lerp(h, 0.14);
        // arrowhead tip (head points along the curve tangent) touching the boombox = hit
        tip.copy(h).addScaledVector(A.curve.getTangentAt(Math.min(st.p, 1)), 1.35);
        if (st.p > 0.6 && box.setFromObject(boombox).expandByScalar(0.05).containsPoint(tip)) { tween.kill(); res(); }
      }
    });
  });
  // HIT → sunburst
  sfx('boom'); flash(1); cam.shake = 0.6; gsap.to(cam, { shake: 0, duration: 0.8 });
  gsap.fromTo(boombox.scale, { x: 2.0, y: 1.0, z: 2.0 }, { x: 1.4, y: 1.4, z: 1.4, duration: 1.1, ease: 'elastic.out(1,.35)' });
  gsap.fromTo(burst1.scale, { x: 0.01, y: 0.01, z: 1 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: 'back.out(2)' });
  spawnConfetti(new V3(0, 3.5, 23.5), 70, 13); spawnNotes(new V3(0, 3.5, 24), 16, 6);
  for (let i = 0; i < 3; i++) setTimeout(() => spawnRipple(new V3(0, 0, 23), 12), i * 160);
  shout('LET\'S GO!', { hold: 0.8, burst: true, size: 0.9 });
  const rs = { a: 0 }; gsap.to(rs, { a: 1, duration: 0.9, delay: 0.3, ease: 'power2.in', onUpdate: () => A.setRange(rs.a, 1), onComplete: () => scene.remove(A.group) });
}

async function curlArrow(at) {
  const pts = []; for (let i = 0; i <= 40; i++) { const a = -0.3 + (i / 40) * TAU * 0.85; pts.push(new V3(Math.cos(a) * 2.2, Math.sin(a) * 2.2, i * 0.02)); }
  const A = new RibbonArrow(new THREE.CatmullRomCurve3(pts), { width: 0.9, thick: 0.4, segs: 200, headLen: 1.3, headW: 1.9 });
  A.group.position.copy(at); scene.add(A.group);
  const st = { p: 0 }; sfx('whoosh');
  gsap.to(A.group.rotation, { z: TAU * 2, duration: 1.4, ease: 'power2.inOut' });  // spins the way the head points
  await tw(st, { p: 1, duration: 0.7, ease: 'power2.out', onUpdate: () => A.setRange(0, st.p) });
  spawnNotes(at, 10, 3);
  await wait(500);
  gsap.to(A.group.scale, { x: 0.5, y: 0.5, z: 0.5, duration: 0.6, ease: 'power2.in' });
  await tw(A.group.position, { y: at.y + 22, z: at.z - 6, duration: 0.6, ease: 'power3.in' });
  scene.remove(A.group);
}

async function floorRun() {
  floorArrow.group.visible = true; jumper.root.visible = true; poseReset(jumper);
  sfx('whoosh');
  const st = { p: 0 }, tp = new V3(), tl = new V3(); let faded = false, jumped = false, poseDone;
  const posed = new Promise(r => poseDone = r);
  tw(st, {
    p: 1, duration: 3.2, ease: 'none', onUpdate: () => {
      floorArrow.setRange(0, st.p); const h = floorArrow.headPos;
      if (!jumped) {
        // skateboard cam: ride low right behind the head, carve with the curve
        const u = Math.min(st.p, 0.97), T = floorCurve.getTangentAt(u), T2 = floorCurve.getTangentAt(Math.min(u + 0.03, 1));
        tp.copy(h).addScaledVector(T, -8).add(new V3(0, 2.6, 0));
        tl.copy(h).addScaledVector(T, 9).add(new V3(0, 1.2, 0));
        cam.pos.lerp(tp, 0.16); cam.look.lerp(tl, 0.16);
        const turn = T.x * T2.z - T.z * T2.x;
        cam.roll += (THREE.MathUtils.clamp(turn * 6, -0.18, 0.18) - cam.roll) * 0.1;
      }
      if (!faded && h.z < JZ + 13) { faded = true; { const jm = jumper.root.children[0].children[0].material; gsap.to(jm, { opacity: 1, duration: 0.2, onComplete: () => { jm.transparent = false; jm.needsUpdate = true; } }); } }
      if (!jumped && h.z < JZ + 11) { jumped = true; doJump(); }
    }
  });
  async function doJump() {
    // settle the camera dead-centre on the jumper
    moveCam([0, 2.6, JZ + 11.5], [0, 4.3, JZ], 0.6, 'power2.out'); gsap.to(cam, { roll: 0, duration: 0.5 });
    const j = { u: 0 }; let burst = false;
    await tw(j, {
      u: 1, duration: 1.3, ease: 'expo.out', onUpdate: () => {
        // shoots up, decelerates hard and hangs frozen at the top in the split
        jumper.root.position.y = j.u * 3.2; leap(jumper, Math.min(1, j.u * 1.15));
        if (!burst && j.u > 0.85) { burst = true; setTimeout(poseDone, 450); sfx('boom'); flash(0.7); gsap.fromTo(burst3.scale, { x: 0.01, y: 0.01, z: 1 }, { x: 1, y: 1, z: 1, duration: 0.8, ease: 'back.out(2)' }); spawnConfetti(new V3(0, 3.5, JZ + 1), 60, 11); spawnNotes(new V3(0, 4, JZ + 1), 12, 5); }
      }
    });
  }
  await posed;
}

async function run(game) {
  if (game === 'demos') applyDemosTheme();
  window.GameGrip.game = game;
  document.getElementById('gameChip').textContent = game.toUpperCase();
  if (!audio) { audio = initAudio(); if (muted) audio.master.gain.value = 0; }
  emit('start', { game });
  gsap.to('#titleUI', { opacity: 0, duration: 0.3, onComplete: () => document.getElementById('titleUI').style.display = 'none' });
  // gamegrip_server.py opens the ESP32 now; any problem shows the error screen
  const connected = bridge.waitFor('connected'); connected.catch(() => {});
  bridge.start(game).catch(() => showError({ title: 'CAN\'T REACH GAMEGRIP_SERVER.PY',
    message: 'This page has to be opened through the GameGrip server so it can run the swing detector. In the GameGrip folder run <code>python gamegrip_server.py</code> — it opens <code>http://127.0.0.1:8765</code> for you.' }));
  try {
    reveal('box', 0.05);
    await guard(introArrow());
    await guard(moveCam([0, 6.5, 44], [0, 2.5, 23], 1.3, 'power2.out'));           // camera zooms out after burst
    document.getElementById('hud').classList.remove('hidden2');
    reveal('city', 0); reveal('cityTrees', 0, 0.35); reveal('cityPeople', 0.05, 0.7); gsap.to(cam, { roll: 0, duration: 2 });
    await guard(moveCam([-5, 1.7, 72], [0, 5, 56], 3.0, 'power3.inOut'));          // pull back into the city
    await guard(connected);
    setStep(0, 'active');
    await guard(shout('HOLD STILL!', { sub: 'FREEZE THAT TOY', burst: true, hold: 0.9, size: 0.8 }));
    bridge.ready();                                                                // dtw_detector.calibrate() starts
    await guard(calibrateFromPython());                                            // ...through "CALIBRATED!"
    await guard(floorRun());
    await guard(shout('CALIBRATED!', { hold: 0.9, burst: true, size: 0.95 }));
    await readyScene();                                                            // dtw_detector.detect() is live: swings hit the star
  } catch (e) { if (e !== ABORT) throw e; }
}

/* ============================================================
   FRAME — concentric rings (TL/BR) alternating with halftone dithering (TR/BL)
   ============================================================ */
{
  const fr = rng(2024), K = '#000', W = '#fff', L = '#9be22c', LH = '#c8ff3d', D = '#2f7d00';
  const rings = (cx, cy, r, cols, spin = false) => {
    const step = r / cols.length;
    return `<g class="${spin ? 'spin' : ''}">` + cols.map((c, i) => `<circle cx="${cx}" cy="${cy}" r="${(r - i * step).toFixed(1)}" fill="${c}"/>`).join('') + '</g>';
  };
  const halftone = (ox, oy, R0, step, col, max = 4.6) => {
    let out = '';
    for (let y = 0; y < R0; y += step) for (let x = 0; x < R0; x += step) {
      const xx = x + ((y / step) % 2 ? step / 2 : 0), d = Math.hypot(xx, y) / R0, r = max * (1 - d) * (0.85 + fr() * 0.3);
      if (r > 0.5) out += `<circle cx="${(ox + xx).toFixed(1)}" cy="${(oy + y).toFixed(1)}" r="${r.toFixed(2)}" fill="${col}"/>`;
    }
    return out;
  };
  const checker = (ox, oy, n, sz, col, reach) => {
    let out = '';
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) if ((i + j) % 2 === 0 && fr() < 1 - Math.hypot(i, j) / reach) out += `<rect x="${ox + i * sz}" y="${oy + j * sz}" width="${sz}" height="${sz}" fill="${col}"/>`;
    return out;
  };
  const splat = (cx, cy, n) => { let o = ''; for (let i = 0; i < n; i++) { const a = fr() * TAU, d = 8 + fr() * 40; o += `<circle cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d).toFixed(1)}" r="${(1 + fr() * 4).toFixed(1)}" fill="#000"/>`; } return o; };
  const corners = {
    tl: rings(28, 28, 92, [K, W, L, K, LH], true) + rings(150, 22, 42, [K, W, L]) + rings(26, 158, 34, [L, W, K, L]) + rings(112, 104, 18, [K, LH]) + rings(188, 66, 11, [W, K]) + splat(120, 60, 18),
    tr: halftone(0, 0, 270, 13, D, 7.5) + checker(0, 0, 10, 15, K, 10) + halftone(6, 6, 200, 13, K, 5.5) + rings(156, 40, 22, [K, W, L]) + rings(196, 94, 9, [K, LH]),
    br: rings(36, 36, 100, [K, L, W, K, L, W], true) + rings(168, 26, 36, [W, K, LH]) + rings(30, 170, 46, [K, W, L, K]) + rings(130, 118, 15, [K, W]) + splat(110, 80, 16),
    bl: halftone(0, 0, 270, 12, K, 7) + checker(0, 0, 9, 16, D, 8) + halftone(5, 5, 170, 12, L, 4) + rings(44, 150, 30, [L, K, W, L]) + rings(150, 34, 16, [K, LH]) + rings(118, 76, 8, [K]),
  };
  const place = { tl: 'left:0;top:0', tr: 'right:0;top:0;transform:scaleX(-1)', br: 'right:0;bottom:0;transform:scale(-1,-1)', bl: 'left:0;bottom:0;transform:scaleY(-1)' };
  const frame = document.getElementById('frame');
  // jagged thin border: black torn edge with a broken lime line just inside it
  const edge = frame.querySelector('.edge');
  const jag = (inset, amp, seed) => {
    const r = rng(seed), w = innerWidth, h = innerHeight, pts = [], step = 11;
    const j = () => inset + r() * amp;
    for (let x = 0; x <= w; x += step) pts.push([x, j()]);
    for (let y = 0; y <= h; y += step) pts.push([w - j(), y]);
    for (let x = w; x >= 0; x -= step) pts.push([x, h - j()]);
    for (let y = h; y >= 0; y -= step) pts.push([j(), y]);
    return 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
  };
  const drawEdge = () => {
    const w = innerWidth, h = innerHeight;
    edge.setAttribute('viewBox', `0 0 ${w} ${h}`);
    edge.innerHTML = `<path fill="#000" fill-rule="evenodd" d="M-5,-5H${w + 5}V${h + 5}H-5Z ${jag(2, 5, 11)}"/>` +
      `<path fill="none" stroke="#9be22c" stroke-width="2" stroke-dasharray="40 7 14 6" d="${jag(9, 3, 12)}"/>`;
  };
  drawEdge(); addEventListener('resize', drawEdge);
  for (const k in corners) frame.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 270 270" style="${place[k]}"><g>${corners[k]}</g></svg>`);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now() / 1000, lastBeat = -1;
const html = document.documentElement;
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() / 1000, dt = Math.min(0.05, t - last); last = t;
  const beat = audio && audio.t0 !== null ? (audio.songTime() - FIRST_BEAT) / SPB + 1000 : t / SPB;
  const phase = beat - Math.floor(beat), pulse = Math.exp(-phase * 5);
  html.style.setProperty('--pulse', pulse.toFixed(3));
  if (Math.floor(beat) !== lastBeat) { lastBeat = Math.floor(beat); spawnRipple(new V3(cam.look.x, 0, cam.look.z), 6); }
  for (const f of ticks) f(t, dt, beat, pulse);
  for (const d of drivers) { d.scale.z = 1 + pulse * 0.7; }
  updateParts(dt);

  camera.position.copy(cam.pos);
  const i = cam.idle;
  camera.position.x += Math.sin(t * 0.7) * 0.15 * i + cam.sway * Math.sin(t * 9) * 0.3;
  camera.position.y += Math.sin(t * 1.1) * 0.08 * i + pulse * 0.05 * i + cam.sway * Math.sin(t * 9) * 0.22;
  if (cam.shake) camera.position.add(new V3(rr(-1, 1), rr(-1, 1), 0).multiplyScalar(cam.shake * 0.3));
  camera.lookAt(cam.look);
  camera.rotateZ(cam.roll + cam.sway * Math.sin(t * 4.5) * 0.05);
  camera.fov = cam.fov - pulse * 1.4 * i; camera.updateProjectionMatrix();

  dome.position.copy(camera.position);
  dome.material.uniforms.uTime.value = t; dome.material.uniforms.uPulse.value = pulse;
  key.target.position.copy(cam.look); key.position.copy(cam.look).add(new V3(9, 20, 12));
  rim.target.position.copy(cam.look); rim.position.copy(cam.look).add(new V3(-12, 8, -18));
  composer.render();
}
loop();
</script>
